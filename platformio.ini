; PlatformIO Project Configuration File
; HAMLET PANCETTA — WiFi security instrument for M5Stack CoreS3 SE and Core2
;
; Comms: FLOCKNOW (FNOW/3 ESP-NOW peer coordination)
; Primary: CoreS3 SE. Compatibility: Core2 v1.1. Both use 320×240 touch.

; Static analysis shared by every build environment. These settings belong in
; the common [env] section so production checks do not silently inherit the
; optional profiling environment's policy by accident.
[env]
check_skip_packages = yes
check_src_filters =
    +<*>
check_tool = cppcheck
check_flags =
    cppcheck: --inline-suppr
    cppcheck: --suppress=preprocessorErrorDirective
    cppcheck: -i .pio/libdeps

; M5Stack Core2 v1.1 configuration
[env:m5stack-core2]
; ESP32-D0WDQ6-V3, dual LX6 @ 240MHz, 16MB Flash, 8MB PSRAM
platform = espressif32
board = m5stack-core2
framework = arduino
board_build.partitions = partitions_core2.csv
custom_version = 0.1.0-core

; Monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build flags
build_flags =
    -DARDUINO_M5STACK_CORE2
    -DCORE_DEBUG_LEVEL=0
    ; PSRAM support (8MB)
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    ; Version
    -DHAMLET_VERSION='"0.1.0-core"'
    ; Linker flag for wsl_bypasser
    -Wl,-zmuldefs
    ; PSRAM cache workaround
    -DCONFIG_SPIRAM_CACHE_WORKAROUND
    ; Increase Arduino loop stack for TLS operations
    -DARDUINO_LOOP_STACK_SIZE=16384
    ; Allocate mbedTLS buffers in PSRAM
    -DCONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=1
    -DCONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
    -DCONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
    ; BLE support via NimBLE (~40KB DRAM vs Bluedroid ~70KB)
    -DRECON_BLE_SUPPORT=1
    -DHAMLET_WIFI_CSI=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    ; Optional: add -DHAMLET_DEBUG_LOG=1 for subsystem serial logging
    ; Optional: add -DHAMLET_FRAME_PROFILE for serial FRAMESTATS phase breakdown

; Extra scripts
extra_scripts =
    pre:scripts/pre_build.py
    scripts/nimble_iram_fix.py
    scripts/quiet_lib_warnings.py

lib_deps =
    m5stack/M5Unified@^0.2.18
    mikalhart/TinyGPSPlus@^1.1.0
    bblanchon/ArduinoJson@^6.21.0
    fastled/FastLED@^3.6.0
    ricmoo/QRCode@^0.0.1
    h2zero/NimBLE-Arduino@1.4.3

; Optional profile build (uncomment to enable FRAMESTATS detail):
[env:m5stack-core2-profile]
extends = env:m5stack-core2
build_flags =
    ${env:m5stack-core2.build_flags}
    -DHAMLET_DEBUG_LOG=1
    -DHAMLET_FRAME_PROFILE
lib_deps =
    m5stack/M5Unified
    m5stack/M5GFX
    bblanchon/ArduinoJson@^6.21.0
    h2zero/NimBLE-Arduino@1.4.3
    fastled/FastLED@^3.6.0
    mikalhart/TinyGPSPlus@^1.0.3
    ricmoo/QRCode@^0.0.1

; Ignore problematic transitive dependencies we don't use
lib_ignore =
    DFRobot_GP8XXX

; Upload settings
upload_speed = 1500000

; Extra scripts
extra_scripts = ${env:m5stack-core2.extra_scripts}

[env:m5stack-core2-no-csi]
extends = env:m5stack-core2
build_flags =
    ${env:m5stack-core2.build_flags}
    -UHAMLET_WIFI_CSI

; M5Stack CoreS3 SE configuration
[env:m5stack-cores3se]
; ESP32-S3, dual LX7 @ 240MHz, 16MB Flash, 8MB PSRAM.
; No onboard IMU and no vibration motor. An M5GO Bottom2 restores the IMU
; (same MPU6886 as Core2) and supplies the battery. The IMU is detected at
; runtime, so one image covers both with and without the base.
; See docs/reference/cores3se-port.md.
platform = espressif32
board = m5stack-cores3
framework = arduino
board_build.partitions = partitions_cores3se.csv
custom_version = 0.1.0-cores3se

; Monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DHAMLET_CORE3SE=1
    ; ARDUINO_M5STACK_CORES3 and BOARD_HAS_PSRAM come from the board definition.
    ; The ESP32 PSRAM cache errata flags (-mfix-esp32-psram-cache-issue and
    ; CONFIG_SPIRAM_CACHE_WORKAROUND) are deliberately absent: the S3 has no
    ; such bug. scripts/nimble_iram_fix.py gates its linker surgery on this.
    ; Version
    -DHAMLET_VERSION='"0.1.0-cores3se"'
    ; Linker flag for wsl_bypasser
    -Wl,-zmuldefs
    ; Increase Arduino loop stack for TLS operations
    -DARDUINO_LOOP_STACK_SIZE=16384
    ; Allocate mbedTLS buffers in PSRAM
    -DCONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=1
    -DCONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
    -DCONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
    ; BLE support via NimBLE
    -DRECON_BLE_SUPPORT=1
    -DHAMLET_WIFI_CSI=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

extra_scripts = ${env:m5stack-core2.extra_scripts}

lib_deps = ${env:m5stack-core2.lib_deps}

lib_ignore =
    DFRobot_GP8XXX

upload_speed = 921600

; ==[ MESH SNIFFER ]== a throwaway build for answering "is the C6L even
; talking". Hexdumps the Grove UART to the USB console, prints every assembled
; line, heartbeats what the parser made of it, and forces the bridge up at boot
; even when M3SH T4LK is switched off in settings. Never flash this as the
; keeper image — the dump alone is three console bytes per wire byte.
;   platformio.exe run -t upload -e m5stack-cores3se-meshtrace --upload-port COM11
;   platformio.exe device monitor -p COM11 -b 115200
; Purely passive: the sniffer only ever listens on the configured pins.
[env:m5stack-cores3se-meshtrace]
extends = env:m5stack-cores3se
build_flags =
    ${env:m5stack-cores3se.build_flags}
    -DHAMLET_DEBUG_LOG=1
    -DHAMLET_MESH_TRACE=1
